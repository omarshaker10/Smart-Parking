<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Garage Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --danger: #ef4444; --success: #10b981; --bg: #f1f5f9; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; border-radius: 0 0 25px 25px; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; text-align: center; }
        .val { font-size: 22px; font-weight: bold; color: var(--accent); display: block; }
        .alert-box { padding: 12px; border-radius: 12px; margin-top: 10px; font-weight: bold; text-align: center; }
        .safe { background: #dcfce7; color: #166534; }
        .danger { background: #fee2e2; color: #991b1b; animation: pulse 1s infinite; }
        @keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }
        .nav-bar { display: flex; background: white; border-radius: 15px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-item { flex: 1; padding: 15px; border: none; background: none; font-family: 'Cairo'; cursor: pointer; font-weight: bold; }
        .nav-item.active { background: var(--accent); color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td { padding: 8px; border-bottom: 1px solid #edf2f7; text-align: center; }
    </style>
</head>
<body>

<div class="header"><h2>Smart Garage Pro</h2></div>

<div class="container">
    <div class="nav-bar">
        <button id="userTab" class="nav-item active" onclick="showSection('user')">الزائر</button>
        <button id="adminTab" class="nav-item" onclick="showSection('admin')">المهندس</button>
    </div>

    <div id="userSection">
        <div class="card">
            <span>الأماكن المتاحة</span>
            <span id="parkingSlots" class="val">4/4 أماكن</span>
        </div>
    </div>

    <div id="adminSection" style="display: none;">
        <div id="gasStatus" class="alert-box safe">حالة الغاز: آمن ✅</div>
        <div id="fireStatus" class="alert-box safe">حالة الحريق: آمن ✅</div>
        <div id="envStatus" class="alert-box safe">الحرارة والرطوبة: آمن ✅</div>
        
        <div class="card">
            <h4>🎥 سجل حركة السيارات</h4>
            <table>
                <tbody id="carLogs"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let toggleCycle = 0;
    let lastSlotStatus = null;

    async function fetchLiveData() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();

            // 1. الأماكن (من 4)
            let slots = data.slot_is_busy ? "3/4" : "4/4";
            document.getElementById('parkingSlots').innerText = slots + " أماكن";

            // 2. سجل السيارات (تحديث تلقائي)
            if (lastSlotStatus !== null && data.slot_is_busy !== lastSlotStatus) {
                let logs = document.getElementById('carLogs');
                let action = data.slot_is_busy ? "دخول سيارة" : "خروج سيارة";
                logs.innerHTML = `<tr><td>${action}</td><td>${new Date().toLocaleTimeString()}</td></tr>` + logs.innerHTML;
            }
            lastSlotStatus = data.slot_is_busy;

            // 3. الغاز (نسبة مئوية)
            let gasPercent = ((data.gas_percentage / 500) * 100).toFixed(1);
            let gasDiv = document.getElementById('gasStatus');
            if(gasPercent > 30) {
                gasDiv.innerHTML = `⚠️ خطر: الغاز ${gasPercent}%`;
                gasDiv.className = "alert-box danger";
            } else {
                gasDiv.innerHTML = `حالة الغاز: آمن (${gasPercent}%) ✅`;
                gasDiv.className = "alert-box safe";
            }

            // 4. الحريق
            let fireDiv = document.getElementById('fireStatus');
            if(data.flame_detected) {
                fireDiv.innerText = "🔥 خطر: حريق مكتشف!";
                fireDiv.className = "alert-box danger";
            } else {
                fireDiv.innerText = "حالة الحريق: آمن ✅";
                fireDiv.className = "alert-box safe";
            }

            // 5. الحرارة والرطوبة (تظهر بالتناوب)
            let envDiv = document.getElementById('envStatus');
            envDiv.innerText = (toggleCycle % 2 === 0) ? `🌡️ الحرارة: ${data.temperature}°C` : `💧 الرطوبة: ${data.humidity}%`;
            toggleCycle++;

        } catch (e) { console.error("Error", e); }
    }

    function showSection(s) {
        document.getElementById('userSection').style.display = (s === 'user') ? 'block' : 'none';
        document.getElementById('adminSection').style.display = (s === 'admin') ? 'block' : 'none';
    }

    setInterval(fetchLiveData, 2000);
    window.onload = fetchLiveData;
</script>
</body>
</html>
