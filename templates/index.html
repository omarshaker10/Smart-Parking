<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Garage Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --danger: #ef4444; --success: #10b981; --bg: #f1f5f9; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .val { font-size: 18px; font-weight: bold; color: var(--accent); }
        .alert-box { padding: 10px; border-radius: 10px; margin-top: 5px; font-weight: bold; text-align: center; }
        .safe { background: #dcfce7; color: #166534; }
        .danger { background: #fee2e2; color: #991b1b; animation: pulse 1s infinite; }
        @keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: center; }
    </style>
</head>
<body>

<div class="header"><h2>Smart Garage Pro</h2></div>

<div class="container">
    <div class="card">
        <p>الأماكن المتاحة: <span id="parkingSlots" class="val">--</span></p>
    </div>

    <div id="gasAlert" class="alert-box safe">حالة الغاز: آمن ✅</div>
    <div id="fireAlert" class="alert-box safe">حالة الحريق: آمن ✅</div>
    <div id="tempHumAlert" class="alert-box safe">الحرارة والرطوبة: آمن ✅</div>

    <div class="card">
        <h4>🎥 سجل حركة السيارات</h4>
        <table>
            <thead><tr><th>الحالة</th><th>الوقت</th></tr></thead>
            <tbody id="carLogs"></tbody>
        </table>
    </div>
</div>

<script>
    let lastStatus = "";

    async function updateDashboard() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();

            // 1. الأماكن (من 4)
            let busy = data.slot_is_busy;
            document.getElementById('parkingSlots').innerText = busy ? "3 من 4" : "4 من 4";

            // 2. تحديث سجل السيارات (لو الحالة اتغيرت)
            let currentStatus = busy ? "دخول سيارة" : "خروج سيارة";
            if (currentStatus !== lastStatus) {
                let logs = document.getElementById('carLogs');
                let row = `<tr><td>${currentStatus}</td><td>${new Date().toLocaleTimeString()}</td></tr>`;
                logs.innerHTML = row + logs.innerHTML;
                lastStatus = currentStatus;
            }

            // 3. تنبيه الغاز (بشرط 30%)
            let gasAlert = document.getElementById('gasAlert');
            if (data.gas_percentage > 30) {
                gasAlert.innerText = "⚠️ خطر: مستوى الغاز مرتفع!";
                gasAlert.className = "alert-box danger";
            } else {
                gasAlert.innerText = "حالة الغاز: آمن ✅";
                gasAlert.className = "alert-box safe";
            }

            // 4. تنبيه الحريق
            let fireAlert = document.getElementById('fireAlert');
            if (data.flame_detected) {
                fireAlert.innerText = "🔥 خطر: حريق مكتشف!";
                fireAlert.className = "alert-box danger";
            } else {
                fireAlert.innerText = "حالة الحريق: آمن ✅";
                fireAlert.className = "alert-box safe";
            }
            
        } catch (e) { console.error(e); }
    }

    setInterval(updateDashboard, 2000);
    updateDashboard();
</script>
</body>
</html>
